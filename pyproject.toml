[project]
name = "py-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AlanVignolo", email = "alanvignolo1999@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy<2",
    "opencv-python-headless>=4.11.0.86",
    "pandas>=2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.mypy]
strict = true
