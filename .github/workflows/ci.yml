name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4 # Clona el repo

      - name: Install uv
        uses: astral-sh/setup-uv@v5 # Instala uv con cache integrado
        with:
          python-version: ${{ matrix.python-version}}
          enable-cache: true
      
      - name: Install dependencies
        run: uv sync --all-groups # --all-groups instala dependencias dev tambien
      
      - name: Lint
        run: uv run ruff check src/ tests/
      
      - name: Format
        run: uv run ruff format --check src/ tests/ #--check verifica sin modificar
      
      - name: Types
        run: uv run mypy src/
      
      - name: Tests
        run: uv run pytest tests/ --cov=py_template